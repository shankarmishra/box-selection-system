{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Box Selection System{% endblock %}</title>
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --border: #334155; --text: #e2e8f0;
    --muted: #94a3b8; --accent: #38bdf8; --good: #4ade80; --bad: #f87171;
    --warn: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem; background: var(--bg); color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, sans-serif; line-height: 1.5;
  }
  a { color: var(--accent); }
  h1, h2, h3 { font-weight: 600; }
  header.top { display: flex; justify-content: space-between; align-items: baseline;
               margin-bottom: 1.5rem; flex-wrap: wrap; gap: .5rem; }
  header.top nav a { margin-left: 1rem; font-size: .9rem; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
           padding: 1.25rem 1.5rem; margin-bottom: 1.25rem; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { text-align: left; padding: .5rem .6rem; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; text-transform: uppercase; font-size: .75rem;
       letter-spacing: .04em; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .badge { display: inline-block; padding: .15rem .55rem; border-radius: 999px;
           font-size: .75rem; font-weight: 600; }
  .badge.selected { background: rgba(74,222,128,.15); color: var(--good); }
  .badge.rejected { background: rgba(248,113,113,.15); color: var(--bad); }
  .badge.other { background: rgba(148,163,184,.15); color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
          gap: 1rem; }
  .svg-wrap { background: #0b1120; border-radius: 8px; padding: .5rem; }
  .stat { font-size: 1.6rem; font-weight: 700; }
  .stat-label { color: var(--muted); font-size: .8rem; }
</style>
</head>
<body>
<header class="top">
  <h1 style="margin:0;">📦 Box Selection System</h1>
  <nav>
    <a href="/">Home</a>
    <a href="/api/docs/">API Docs</a>
    <a href="/admin/">Admin</a>
  </nav>
</header>
{% block content %}{% endblock %}
</body>
</html>
